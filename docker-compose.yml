services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: techstore
      POSTGRES_USER: techstore
      POSTGRES_PASSWORD: techstore123
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./Backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: techstore
      DB_USER: techstore
      DB_PASSWORD: techstore123
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  db_data: